<svg xmlns="http://www.w3.org/2000/svg" width="130" height="32" viewBox="0 0 130 32">
  <defs>
    <style>
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal;
      font-weight: 400;
      src: url('data:font/truetype;base64,FONT_PLACEHOLDER') format('truetype');
    }
    .bg      { fill: #0d1117; }
    .border  { fill: none; stroke: #00ADD8; stroke-width: 1.5; }
    .divider { stroke: #00ADD8; stroke-width: 1; opacity: 0.4; }
    .label   { fill: #00ADD8; font-family: 'Press Start 2P', monospace; font-size: 7px; font-weight: 400; }
    .glow1   { fill: #00ADD8; font-family: 'Press Start 2P', monospace; font-size: 7px; font-weight: 400; opacity: 0.6; }
    .glow2   { fill: #00ADD8; font-family: 'Press Start 2P', monospace; font-size: 7px; font-weight: 400; opacity: 0.3; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
    }
    </style>
    <filter id="neon-sm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pill">
      <rect width="130" height="32" rx="6" ry="6"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="130" height="32" class="bg" clip-path="url(#pill)"/>
  <rect x="38" y="0" width="92" height="32" fill="#00ADD8" fill-opacity="0.08" clip-path="url(#pill)"/>
  <rect x="0.75" y="0.75" width="128.5" height="30.5" rx="5.5" ry="5.5" class="border" filter="url(#neon-sm)"/>
  <rect x="0.75" y="0.75" width="128.5" height="30.5" rx="5.5" ry="5.5" class="border"/>
  <line x1="38" y1="4" x2="38" y2="28" class="divider"/>

  <!-- Echo logo: isometric blocks in cyan + gray, inline SVG via foreignObject workaround -->
  <!-- Inline vector blocks directly in badge coordinate space, scaled to 24x24 at x=7,y=4 -->
  <g transform="translate(7,4) scale(0.24)">
    <!-- Right column: 3 cyan cubes -->
    <polygon points="75,18 100,31 75,44 50,31" fill="#00BCD4"/>
    <polygon points="50,31 75,44 75,57 50,44" fill="#0097A7"/>
    <polygon points="75,44 100,31 100,44 75,57" fill="#00ACC1"/>

    <polygon points="75,44 100,57 75,70 50,57" fill="#00BCD4"/>
    <polygon points="50,57 75,70 75,83 50,70" fill="#0097A7"/>
    <polygon points="75,70 100,57 100,70 75,83" fill="#00ACC1"/>

    <polygon points="75,70 100,83 75,96 50,83" fill="#00BCD4"/>
    <polygon points="50,83 75,96 75,109 50,96" fill="#0097A7"/>
    <polygon points="75,96 100,83 100,96 75,109" fill="#00ACC1"/>

    <!-- Left column: 2 gray cubes -->
    <polygon points="50,5 75,18 50,31 25,18" fill="#BDBDBD"/>
    <polygon points="25,18 50,31 50,44 25,31" fill="#757575"/>
    <polygon points="50,31 75,18 75,31 50,44" fill="#9E9E9E"/>

    <polygon points="50,31 75,44 50,57 25,44" fill="#BDBDBD"/>
    <polygon points="25,44 50,57 50,70 25,57" fill="#757575"/>
    <polygon points="50,57 75,44 75,57 50,70" fill="#9E9E9E"/>
  </g>

  <text x="84" y="20" text-anchor="middle" class="glow2" filter="url(#neon-lg)">Echo</text>
  <text x="84" y="20" text-anchor="middle" class="glow1" filter="url(#neon-sm)">Echo</text>
  <text x="84" y="20" text-anchor="middle" class="label">Echo</text>
</svg>