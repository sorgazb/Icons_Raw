<svg xmlns="http://www.w3.org/2000/svg" width="130" height="32" viewBox="0 0 130 32">
  <defs>
    <style>
      .bg-left { fill: #0d1117; }
      .bg-right { fill: #F7DF1E; }
      .border { fill: none; stroke: #F7DF1E; stroke-width: 1.5; }
      .divider { stroke: #F7DF1E; stroke-width: 1; opacity: 0.5; }
      .label { fill: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; }

      @media (prefers-color-scheme: light) {
        .bg-left { fill: #ffffff; }
        .bg-right { fill: #F7DF1E; }
        .label { fill: #000000; }
      }
    </style>
    <clipPath id="pill">
      <rect width="130" height="32" rx="6" ry="6"/>
    </clipPath>
  </defs>

  <!-- Fondo izquierda (logo) -->
  <rect x="0" y="0" width="38" height="32" class="bg-left" clip-path="url(#pill)"/>

  <!-- Fondo derecha (texto) -->
  <rect x="38" y="0" width="92" height="32" class="bg-right" clip-path="url(#pill)"/>

  <!-- Borde exterior pill -->
  <rect x="0.75" y="0.75" width="128.5" height="30.5" rx="5.5" ry="5.5" class="border"/>

  <!-- Línea divisoria vertical -->
  <line x1="38" y1="4" x2="38" y2="28" class="divider"/>

  <!-- Logo Power BI (SVG incrustado, centrado en bloque izquierdo) -->
  <image href="data:image/svg+xml;base64," x="7" y="4" width="24" height="24"/>

  <!-- Texto -->
  <text x="84" y="20.5" text-anchor="middle" class="label">JavaScript</text>
</svg>